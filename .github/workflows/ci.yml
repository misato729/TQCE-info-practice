name: Application checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tqce_ci_test
          POSTGRES_USER: tqce_ci
          # Synthetic credentials for this disposable CI database only.
          POSTGRES_PASSWORD: ci-disposable-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tqce_ci -d tqce_ci_test"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_ENV: test
      DATABASE_URL: postgresql://tqce_ci:ci-disposable-password@127.0.0.1:5432/tqce_ci_test
      BETTER_AUTH_SECRET: ci-only-disposable-authentication-secret-not-for-deployment-00000000
      BETTER_AUTH_URL: http://127.0.0.1:3318
      FRONTEND_URL: http://127.0.0.1:3318
      CORS_ORIGINS: http://127.0.0.1:3318
      PAID_MEMBERSHIP_ENABLED: 'false'
      ERROR_NOTIFICATIONS_ENABLED: 'false'
      NUXT_PUBLIC_API_BASE: ''
      NUXT_API_BASE_INTERNAL: ''
      NODE_OPTIONS: --max-old-space-size=2048
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Validate schemas and synthetic fixtures
        run: npm run security:check && npm run db:validate && npm run schema:check && node --experimental-strip-types ../scripts/check-template.mjs
      - name: Apply migrations to the isolated test database
        run: npm run db:migrate
      - name: Check PostgreSQL API and security regressions
        run: npm run test:server
      - name: Check frontend regressions
        run: node --experimental-strip-types --test --test-concurrency=1 tests/*.test.ts
      - name: Check application types
        run: npm run typecheck
      - name: Build the Fly API
        run: NUXT_API_ONLY=true NUXT_STATIC_FRONTEND=false npm run build
      - name: Generate the Netlify frontend without a live API
        run: NUXT_STATIC_FRONTEND=true NUXT_API_ONLY=false npm run generate

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tqce_ci_e2e_test
          POSTGRES_USER: tqce_e2e
          # Synthetic credentials for this disposable CI database only.
          POSTGRES_PASSWORD: ci-e2e-disposable-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tqce_e2e -d tqce_ci_e2e_test"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 20
    env:
      E2E_DATABASE_URL: postgresql://tqce_e2e:ci-e2e-disposable-password@127.0.0.1:5432/tqce_ci_e2e_test
      NODE_OPTIONS: --max-old-space-size=2048
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Check desktop and mobile browser flows with synthetic fixtures
        run: npm run test:e2e
      - name: Save browser test diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-diagnostics
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
          if-no-files-found: ignore
