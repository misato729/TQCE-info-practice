[build.environment]
  # These Basic Auth values collide with ordinary application identifiers.
  # Credentials are read from private runtime config, not embedded in source.
  # Remove each exception after replacing that credential with a unique value.
  # All other environment variables and secret scanning remain enabled.
  SECRETS_SCAN_OMIT_KEYS = "NUXT_BASIC_AUTH_USER,NUXT_BASIC_AUTH_PASSWORD"
