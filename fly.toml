# Deploy from the repository root. Keep the existing API and webhook hostname.
app = 'tqce-info-practice'
primary_region = 'nrt'

[build]
  dockerfile = 'frontend/Dockerfile'
  build-target = 'production'

[deploy]
  release_command = 'npm run db:migrate'
  release_command_timeout = '15m'

[env]
  APP_ENV = 'production'
  NODE_ENV = 'production'
  NUXT_API_ONLY = 'true'
  NITRO_HOST = '0.0.0.0'
  NITRO_PORT = '3000'
  NODE_OPTIONS = '--max-old-space-size=512'
  BETTER_AUTH_URL = 'https://johokyonin-lab.netlify.app'
  FRONTEND_URL = 'https://johokyonin-lab.netlify.app'
  CORS_ORIGINS = 'https://johokyonin-lab.netlify.app'
  # DATABASE_URL and BETTER_AUTH_SECRET use Fly secrets. Existing Stripe and
  # PAID_MEMBERSHIP_ENABLED secrets are retained without enabling new sales.

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/api/v1/health'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
