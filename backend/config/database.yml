<% test_database_url = ENV["TEST_DATABASE_URL"] || ENV["DATABASE_URL"]&.sub(%r{/[^/?]+(?=\?|$)}, "/tqce_test") %>

default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
  host: <%= ENV.fetch("DB_HOST", "localhost") %>
  username: <%= ENV.fetch("POSTGRES_USER", "postgres") %>
  password: <%= ENV.fetch("POSTGRES_PASSWORD", "postgres") %>

development:
  <<: *default
  database: tqce_development

test:
  <<: *default
  url: <%= test_database_url %>
  database: tqce_test

production:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>
  database: tqce_production
